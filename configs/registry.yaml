# FROZEN TRIAL REGISTRY — committed BEFORE any test-fold evaluation.
# Unit of a trial: the seed-ensembled strategy (mean probability across seeds).
# Everything below touches CPCV test folds and enters the DSR trial count.
# Anything not listed is exploratory and may not be promoted post hoc.

primary:
  name: vb_mae            # V-B dual-time 3D CNN, MAE-pretrained, dollar bars,
                          # FFD inputs, K=16, L=32; sign trading rule
  claim: "net-of-cost DSR >= 0.95 at headline cost (pilot scale: directional evidence)"

secondary_hypotheses:
  S1_3d_vs_2d:        [vb_scratch, vb2d]        # 3D beats param-matched 2D control
  S2_dual_vs_single:  [vb_scratch, clock_only, info_only]
  S3_crosstime_field: [vc, vb2d]                # V-C beats 2D given same content
  S4_beats_linear:    [vb_mae, gao_ols, xgboost]
  S5_beats_sequence:  [vb_mae, minirocket]
  S6_ssl_benefit:     [vb_mae, vb_scratch]
  S7_depth_structure: [vb_scratch, vb_shuffled] # shuffled depth must hurt

nn_trials:      # 3 seeds each (0,1,2) except vb_shuffled (seed 0 only)
  - vb_mae
  - vb_scratch
  - vb2d
  - vc
  - va
  - clock_only
  - info_only
  - vb_shuffled

baseline_trials:  # deterministic (seed 0)
  - gao_ols       # r_last30 ~ r_first30 + r_on, train-fold OLS
  - gao_sign      # sign of first half-hour return
  - gao_vol       # vol-scaled Gao OLS
  - logistic      # 8 handcrafted features
  - xgboost       # same features
  - minirocket    # [clock; info] 2-channel series
  - always_long

meta_trials:
  - meta_vb_mae   # trade/no-trade logistic on primary prob + tabular (fit on inner val)

pilot_scope_notes: |
  Pilot compressions vs the full protocol (documented, not silent): CPCV N=6
  (15 splits, 5 paths) instead of N=10; 3 seeds instead of 5; max 25 epochs;
  GAF encoder only (DWT/MTF not run); FFD input only (vol-scaled ablation not
  run); denoise none; R(2+1)D not run; DINOv2/I3D exploratory comparisons not
  run; imbalance bars not run as primary (Phase-1 diagnostic: 43% floor-
  degenerate vs 20% for dollar bars).
