name: Fetch SPY 1-min dataset from Kaggle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet kagglehub pandas

      - name: Download and stage dataset
        run: python psi_signal_framework/fetch_kaggle_data.py

      - name: Commit data to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Add SPY 1-min data from Kaggle (2010 subset + full gzip)"
          git push
